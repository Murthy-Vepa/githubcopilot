<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Copilot Immersive Experience</title>
<style>
  :root {
    --bg:#ffffff; --sidebar-bg:#f8fafc; --border:#e2e8f0; --text:#334155; --text-muted:#64748b;
    --accent:#3b82f6; --accent-bg:#dbeafe; --code-bg:#0f1c2e; --success:#10b981; --heading:#0f172a;
    --shadow-sm:0 1px 3px rgba(0,0,0,.08); --shadow-md:0 4px 6px rgba(0,0,0,.1),0 2px 4px rgba(0,0,0,.06);
  }
  html{ scroll-behavior:smooth; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .topbar{
    background:#0f172a; color:#fff; padding:.75rem 1.4rem;
    box-shadow:var(--shadow-md); position:sticky; top:0; z-index:20;
  }
  .topbar .brand{ font-weight:700; font-size:15px; }
  .topbar .brand small{ display:block; color:#93c5fd; font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
  .layout { display: flex; min-height: calc(100vh - 52px); }

  /* Sidebar */
  .sidebar {
    width: 300px; flex-shrink: 0;
    background: linear-gradient(180deg,#f8fafc 0%,#eef2f7 100%);
    border-right: 1px solid var(--border);
    padding: 14px 0 60px;
    overflow-y: auto;
    height: calc(100vh - 52px);
    position: sticky; top: 52px;
  }
  .menu-header{ padding:.6rem 20px .4rem; font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); }
  .nav-group { margin-bottom: 4px; padding: 0 .6rem; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; cursor: pointer; border-radius: 8px;
    font-size: 13.5px; color: #1e293b; font-weight: 600;
    border-left: 3px solid transparent;
    transition: background .12s, color .12s;
  }
  .nav-item:hover { background: var(--accent-bg); color: #1d4ed8; }
  .nav-item.active {
    background: var(--accent-bg);
    border-left-color: var(--accent);
    color: #1d4ed8;
  }
  .nav-num {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
    background: #e2e8f0; color: var(--text-muted);
    font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-item.active .nav-num { background: var(--accent); color: #fff; }
  .nav-time { margin-left: auto; font-size: 10.5px; color: var(--text-muted); }

  /* Content */
  .content { flex: 1; padding: 2.2rem clamp(1rem,3vw,3rem) 5rem; max-width: 1080px; }
  .panel { display: none; }
  .panel.active { display: block; }

  .panel .badge-row { display: flex; gap: .4rem; flex-wrap: wrap; margin: .4rem 0 1.1rem; }
  .badge {
    background: var(--accent-bg); border: 1px solid #bfdbfe;
    color: #1d4ed8; font-size: 11.5px; font-weight: 700; padding: .28rem .75rem;
    border-radius: 999px;
  }
  .panel h1 { color: var(--heading); font-weight: 800; font-size: 26px; margin: 0 0 4px; }
  .panel .scenario {
    border-left: 5px solid var(--accent); background: #eff6ff;
    border-radius: 10px; padding: 1rem 1.2rem; margin: 1rem 0; font-size: 14px;
  }
  .panel .scenario strong { display: block; margin-bottom: .3rem; color: var(--heading); }
  .meta-line { color: var(--text-muted); font-size: 13px; margin: 4px 0 16px; }
  .panel h2 {
    color: #1e3a8a; font-weight: 800; font-size: 19px; margin: 32px 0 12px;
    border-bottom: 3px solid var(--accent); padding-bottom: 8px;
  }
  .panel h3 { color: #1e3a8a; font-weight: 750; font-size: 15.5px; margin: 20px 0 8px; }
  .panel p { line-height: 1.65; font-size: 14.5px; }
  .panel ol, .panel ul { line-height: 1.75; font-size: 14.5px; padding-left: 22px; }
  .panel li { margin-bottom: 4px; }
  code {
    background: #e2e8f0; color: #0f172a;
    padding: 1px 6px; border-radius: 5px; font-size: .85em;
    font-family: "Cascadia Code", Consolas, Menlo, monospace;
  }
  pre {
    background: var(--code-bg); color: #dbeafe; border-radius: 10px;
    padding: 1rem 1.15rem; overflow-x: auto; font-size: .83rem; line-height: 1.6;
    box-shadow: var(--shadow-sm);
  }
  pre code { background: none; color: #a5d6ff; padding: 0; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 13.8px; box-shadow: var(--shadow-sm); border-radius: 8px; overflow: hidden; }
  table th, table td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
  table th { background: #1e293b; color: #fff; }
  .learned-box {
    background: #ecfdf5; border-left: 5px solid var(--success); border-radius: 10px;
    padding: 1rem 1.2rem; margin: 20px 0;
  }
  .learned-box h2 { border: none; margin-top: 0; padding-bottom: 0; color: var(--heading); }
  .learned-box ul { list-style: none; padding-left: 0; }
  .learned-box li { margin-bottom: 6px; }
  .value-line { margin-top: 10px; font-size: 13.5px; color: var(--text-muted); }
  .value-line strong { color: var(--heading); }
  .footer-nav {
    display: flex; justify-content: space-between; margin-top: 40px;
    padding-top: 18px; border-top: 1px solid var(--border);
  }
  .footer-nav button {
    background: #fff; border: 1px solid var(--border);
    color: var(--text); padding: 9px 16px; border-radius: 8px; cursor: pointer;
    font-size: 13px; font-weight: 600; box-shadow: var(--shadow-sm);
  }
  .footer-nav button:hover { border-color: var(--accent); color: var(--accent); }
  .footer-nav button:disabled { opacity: .4; cursor: not-allowed; }
  .source-link { font-size: 12px; color: var(--text-muted); margin-top: 30px; }
  @media (max-width: 900px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: relative; top: 0; }
    .content { padding: 24px; }
  }
</style>
</head>
<body>
<div class="topbar">
  <span class="brand"><small>Immersive Workshop</small>GitHub Copilot Immersive Experience</span>
</div>
<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="menu-header">Contents</div>
    <div class="nav-group" id="navGroup"></div>
  </nav>
  <main class="content" id="content"></main>
</div>

<script>
const modules = [
  {
    id: "overview", num: "•", time: "5 min", title: "Overview",

    badges: [],
    html: `
      <p>Welcome to the <strong>GitHub Copilot Immersive Experience</strong> — a scenario-based workshop where you'll tackle real development

      <h2>Workshop Modules</h2>
      <table>
        <tr><th>#</th><th>Module</th><th>Scenario</th><th>Time</th><th>Features</th></tr>

        <tr><td>5</td><td>Code Review</td><td>"Speed up code reviews"</td><td>15 min</td><td>Code Review Agent</td></tr>
        <tr><td>6</td><td>Security</td><td>"Fix vulnerabilities faster"</td><td>20 min</td><td>Code Quality, CodeQL, Secret Scanning</td></tr>
        <tr><td>7</td><td>Legacy Code</td><td>"Understand & refactor old code"</td><td>20 min</td><td>Ask Mode, Inline Chat, Agent Refactoring</td></tr>
        <tr><td>8</td><td>Agent Skills</td><td>"Customize Copilot with skills"</td><td>15 min</td><td>Agent Skills</td></tr>
        <tr><td>9</td><td>End-to-End Tests</td><td>"Add browser testing"</td><td>15 min</td><td>MCP Playwright</td></tr>
        <tr><td>10</td><td>Spec-Driven Development</td><td>"Build from specs, not vibes"</td><td>30 min</td><td>Spec Kit, Spec-Driven Development</td></tr>
        <tr><td>11</td><td>Governance with Hooks</td><td>"Trigger commands on agent events"</td><td>15 min</td><td>Hooks</td></tr>
        <tr><td>12</td><td>Agentic Workflows</td><td>"Intelligent workflows in GitHub Actions"</td><td>35 min</td><td>GitHub Actions, Agentic Workflows</td></tr>
        <tr><td>—</td><td>Wrap Up</td><td>Reflection & next steps</td><td>10 min</td><td>—</td></tr>
      </table>

      <h2>What You'll Accomplish</h2>
      <p>By the end of this workshop, you'll have hands-on experience with:</p>
      <ol>
        <li>Feature Development — Build complete features from design to deployment</li>
        <li>Code Quality & Testing — Improve test coverage and code maintainability</li>
        <li>Security — Identify and fix vulnerabilities automatically</li>
        <li>Code Review — Leverage AI-assisted reviews with security scanning</li>
        <li>Team Collaboration — Use custom agents and shared contexts</li>
        <li>Async Workflows — Delegate work to coding agents while you focus elsewhere</li>
      </ol>

      <h2>Getting Started</h2>
      <p>Start with <em>Setup</em> to prepare your environment, then work through the use cases in order. Each module is self-contained but builds on

      <h2>Prerequisites</h2>
      <ul>
        <li>GitHub account with appropriate permissions</li>
        <li><a href="https://code.visualstudio.com/" target="_blank">Visual Studio Code</a> with
          <a href="https://marketplace.visualstudio.com/items?itemName=GitHub.copilot" target="_blank">GitHub Copilot</a> extension installed</li>
        <li>Git installed locally</li>

      <p class="source-link">Source: <a href="https://copilot-academy.github.io/workshops/immersive-experience" target="_blank">copilot-academy.github.io/workshops/immersive-experience</a></p>
    `
  },
  {

    scenario: null,
    badges: [],
    html: `
      <h2>Prerequisites</h2>
      <ul>
        <li>GitHub account with Copilot enabled</li>
        <li>Option A: GitHub Codespace (recommended for consistency)</li>
        <li>Option B: Local machine with Node.js 18+, Git, VS Code</li>

      <h2>Quick Start</h2>
      <ol>
        <li>Fork or clone the demo repository
          <pre><code>git clone &lt;repo-url&gt; demo_copilot_agent
cd demo_copilot_agent
make install</code></pre>
        </li>
        <li>Verify the build
          <pre><code>make build</code></pre>
        </li>
        <li>Initialize the database
          <pre><code>make db-init</code></pre>
        </li>

      <h2>Next Steps</h2>
      <p>Once your environment is ready, proceed to <em>Feature Development</em> to start building with Copilot.</p>
      <p class="source-link">Source: <a href="https://copilot-academy.github.io/workshops/immersive-experience/setup" target="_blank">immersive-experience/setup</a></p>
    `
  },
  {
    id: "feature_development", num: 1, time: "30 min", title: "Feature Development",
    subtitle: 'Use Case 1: "I\'m asked to add a new feature"',
    scenario: `Your PM says: "We need a shopping cart. Users should be able to add products, see a count in the nav bar, and view their cart on a dedicated page."`,
    badges: ["Planning Mode", "Agent Mode", "Vision"],
    html: `
      <p><strong>Your Challenge:</strong> Build this feature end-to-end, matching a provided design.</p>
      <h2>Step 1: Understand Requirements with Planning Agent</h2>
      <p>The planning agent exists to help build a plan and clarify requirements. It improves the quality of your prompt and ultimately the output.</p>
      <ol>
        <li>Open Copilot Chat, switch to <code>Plan</code> mode</li>
        <li>Drag <code>docs/design/cart.png</code> into chat (feel free to open it to review first)</li>
        <li>Set your model to 'Claude Opus 4.6' or 'Gemini 3.1 Pro'</li>
        <li>Prompt: <code>I need to implement a shopping cart feature in this application matching this image including routing, navbar badge with item count, state management, and add/remove interactions.</code></li>
        <li>Copilot will ask clarifying questions like:
          <ul><li>Should the cart persist across sessions?</li><li>What data should be stored?</li><li>Any constraints on UI/UX?</li></ul>
        </li>
        <li>Answer the questions or say "Use standard e-commerce patterns"</li>
        <li>Review the generated plan - iterate if needed</li>
      </ol>
      <h2>Step 2: Implement with Agent Mode</h2>
      <ol>
        <li>Switch to <code>Agent</code> mode, select <code>Claude Sonnet 4.6</code> model</li>
        <li>Prompt: <code>Implement the plan you just produced.</code></li>
        <li>Agent will: Create Cart component and page; Add routing; Implement state management (Context/Provider); Add NavBar badge; Wire up add/remove functionality</li>
      </ol>
      <p>You can follow along as files are created/modified and also in the task list. If it doesn't run the application to verify it, ask the agent to
      'start the application and verify the cart works as expected'.</p>
      <h2>Step 3: Test & Iterate</h2>
      <ol>
        <li>Run the application: <code>make dev</code></li>
        <li>Test in browser - Click on 'Ports' tab to open port 5137:
          <ul><li>Go to the 'Products' page or click 'Explore Products'</li><li>Increment a quantity of a product and add to cart</li>
          <li>Verify badge updates (shows a count next to the cart icon)</li><li>Click the cart icon to view cart page</li></ul>
        </li>
        <li>If issues arise, have Copilot help troubleshoot. Example prompt: <code>The badge doesn't update when I add items. Fix this.</code></li>
        <li>When you are all done, click 'Keep' to save the changes.</li>
      </ol>
      <div class="learned-box">
        <h2>What You Learned</h2>
        <ul>
          <li>✅ Planning Agent - Clarify ambiguous requirements</li>
          <li>✅ Vision - Copilot understands UI designs</li>
          <li>✅ Agent Mode - Multi-file implementation with iteration</li>
          <li>✅ Self-correction - Agent can fix its own mistakes</li>
        </ul>
        <p class="value-line"><strong>Time Investment:</strong> 30 minutes &nbsp;|&nbsp; <strong>Value:</strong> A complete feature that would normally take 2-3 hours</p>
      </div>
      <p class="source-link">Source: <a href="https://copilot-academy.github.io/workshops/immersive-experience/feature_development" target="_blank">immersive-experience/feature_development</a></p>
    `
  },
  {
    id: "test_coverage", num: 2, time: "20 min", title: "Test Coverage",
    subtitle: 'Use Case 2: "We need better test coverage"',
    scenario: `Your tech lead says: "Our API test coverage is at 45%. We need to get it above 80% before the release."`,
    badges: ["Prompt Files", "Self-Healing"],
    html: `
      <p><strong>Your Challenge:</strong> Systematically improve test coverage across all API routes.</p>
      <h2>Step 1: Use a Reusable Prompt File</h2>
      <p>Manually prompting for test coverage improvements can work, but the process may be inconsistent between developers. Instead, have Copilot create
      a documented prompt file checked into your repository.</p>
      <ol>
        <li>Click the <code>+</code> button in the Copilot Chat panel to clear your history (best practice when switching between use cases)</li>
        <li>Review <code>.github/prompts/demo-unit-test-coverage.prompt.md</code></li>
        <li>Notice it defines: Objective and routes to focus on; Testing patterns to follow (examples); Success Criteria; Links to relevant documentation</li>
        <li>Notice the prompt does not say the percentage desired is greater than 80%. If that was important it could be added here.</li>
      </ol>
      <h2>Step 2: Execute the Prompt</h2>
      <ol>
        <li>Switch to <code>Agent</code> mode, select the <code>Claude Sonnet 4.6</code> model</li>
        <li>Run the prompt:
          <ul><li>Option A: Click the play button when the prompt file is open</li>
          <li>Option B: Type <code>/demo-unit-test-coverage</code> in chat. The prompt name automatically becomes a slash command.</li></ul>
        </li>
      </ol>
      <h2>Step 3: Agent Self-Heals Failures</h2>
      <p>Agent will: analyze current coverage; generate new test cases for product and supplier routes; run tests automatically; fix any failures;
      re-run until tests pass.</p>
      <p><strong>Important:</strong> Press <code>q</code> when coverage report shows to let agent continue. Otherwise it will wait indefinitely.</p>
      <h2>Step 4: Verify Results Yourself</h2>
      <pre><code>make test</code></pre>
      <p>Review the coverage report - it should be significantly improved.</p>
      <div class="learned-box">
        <h2>What You Learned</h2>
        <ul>
          <li>✅ Prompt Files - Reusable, documented workflows</li>
          <li>✅ Iteration - Agent iterates to fix failing tests automatically</li>
          <li>✅ CodeQL Integration - Agent runs security scans after changes</li>
        </ul>
        <p class="value-line"><strong>Time Investment:</strong> 20 minutes &nbsp;|&nbsp; <strong>Value:</strong> Comprehensive test suite that would take days to write manually</p>
      </div>
      <p class="source-link">Source: <a href="https://copilot-academy.github.io/workshops/immersive-experience/test_coverage" target="_blank">immersive-experience/test_coverage</a></p>
    `
  },
  {
    id: "consistent_standards", num: 3, time: "30 min", title: "Consistent Standards",
    subtitle: 'Use Case 3: "We have standards and Copilot needs to understand and follow them"',
    scenario: `You use an internal observability framework (TAO). New developers keep forgetting to add proper logging/metrics. Beyond that, they continue
    to miss compliance requirements which delay releases.`,
    badges: ["Custom Instructions", "Handoffs", "Agent Skills"],
    html: `
      <p><strong>Your Challenge:</strong> Encode team standards so Copilot enforces them automatically.</p>
      <p>One of the most powerful features of Copilot is Custom Instructions. These allow you to define rules that Copilot applies automatically based
      on file path, type, or other criteria.</p>
      <h2>Step 1: Review Current Standards</h2>
      <ol>
        <li>Open <code>.github/copilot-instructions.md</code></li>
        <li>See existing standards for the project. Note you can reference other files, links, etc.
          <ul><li>Formatting is just markdown. Be concise as this takes up context space.</li><li>You can reference other files or links for more detail.</li>
          <li>For your projects, the more documentation you have in repo the better, as Copilot agent mode can reference it directly.</li></ul>
        </li>
      </ol>
      <p><strong>Important:</strong> Don't have a <code>copilot-instructions.md</code> file yet? Click the gear icon at the top of the Copilot Chat panel,
      then "Generate Chat Instructions" to generate a starter file from your workspace. Alternatively, check out
      <a href="https://github.com/github/awesome-copilot/tree/main/instructions" target="_blank">awesome-copilot instructions</a> for inspiration.</p>
      <h2>Step 2: Add Custom Instructions</h2>
      <p>Add this section to <code>copilot-instructions.md</code>:</p>
      <pre><code>## REST API Guidelines
For all REST API endpoints:
* Use descriptive naming following RESTful conventions
* Add Swagger/OpenAPI documentation
* Implement TAO observability (logging, metrics, tracing)
  - Assume TAO package is already installed
  - Follow patterns in existing routes</code></pre>
      <p>TAO is a fictitious observability framework for this workshop (see <code>docs/tao.md</code>), used to show that you can encode your own
      internal standards that Copilot can reference.</p>
      <h2>Step 3: Test the Instructions</h2>
      <ol>
        <li>Clear chat history, switch to <code>Agent</code> mode. Choose any model (Claude Sonnet 4.6 recommended)</li>
        <li>Prompt: <code>Add observability to the Supplier route using our internal standards</code></li>
        <li>Notice Copilot: adds TAO logging; includes metrics; adds tracing; doesn't try to install TAO (respects your instruction)</li>
        <li>Click 'Undo' to revert all changes. We don't want to keep these changes as TAO is fictitious and it will break our app!</li>
      </ol>
      <h2>Step 4: Create a Handoff</h2>
      <p>Sometimes you need to pass context to a teammate, a new chat session, or an agent. Custom prompts can help with this.</p>
      <ol>
        <li>Clear chat, switch to <code>Plan</code> mode. Consider switching to <code>Gemini 3.1 Pro</code> or <code>Claude Opus 4.6</code> for planning use cases.</li>
        <li>Prompt: <code>Create a plan for a user profile page with edit capability and picture upload</code></li>
        <li>Switch to <code>Agent</code> mode and run the handoff command: <code>/handoff</code> (NOT <code>/handoff-to-copilot-coding-agent</code> unless
        you want an agent to implement it right away)</li>
        <li>Review generated <code>handoff.md</code> - contains: Requirements summary; Implementation plan; Key decisions/assumptions; Next steps</li>
      </ol>
      <p>The steps are just defined in <code>.github/prompts/handoff.prompt.md</code>. You can customize this — e.g. automatically create a file in your
      workspace or create a GitHub issue.</p>
      <h2>Step 5: Add External Documentation as Context with Agent Skills</h2>
      <p>Copilot instructions drive behavior in your current repo/workspace. But what about shared context across multiple repos — a shared design
      system, style guide, or architecture principles? Agent skills combine a markdown prompt with the ability to reference other resources or run
      packaged scripts.</p>
      <ol>
        <li>Check out the <code>feature-add-tos-download</code> branch: <code>git checkout feature-add-tos-download</code> (you may need to
        <code>git stash</code> first)</li>
        <li>Review the agent skill and example octocat compliance documentation available at
        <a href="https://github.com/copilot-academy/od-octocat-supply-compliance-docs" target="_blank">copilot-academy/od-octocat-supply-compliance-docs</a></li>
        <li>Install this skill using <a href="https://skills.sh/" target="_blank">skills.sh</a>:
          <pre><code>npx skills add https://github.com/copilot-academy/od-octocat-supply-compliance-docs -a github-copilot -y</code></pre>
          This pulls the relevant files into <code>.agents/skills/compliance</code>.
        </li>
        <li>Clear chat history, switch to <code>Agent</code> mode, using the <code>Claude Sonnet 4.6</code> model</li>
        <li>Prompt: <code>Please analyze my current changes in the PR: Did we include all the necessary languages for the Terms of Service download?</code></li>
        <li>Additional prompts:
          <ul><li><code>Check if we have all the necessary legal disclaimers included in our Privacy Policy update.</code></li>
          <li><code>We need to implement a Cookie Banner. Implement it according to the compliance requirements we have in our Copilot Space 'OD OctoCAT Supply Compliance Docs'.</code></li></ul>

      </ol>
      <div class="learned-box">
        <h2>What You Learned</h2>
        <ul>

    subtitle: 'Use Case 10: "I want to build from specs, not vibes"',
    scenario: `Your team struggles with "vibe coding" - starting implementation before requirements are clear, leading to rework, scope creep, and

    badges: ["Spec Kit", "Spec-Driven Development"],
    html: `
      <p><strong>Your Challenge:</strong> Adopt Specification-Driven Development (SDD) to transform requirements into implementation systematically,
      with specifications as executable artifacts that drive code generation.</p>
      <h2>What is Spec-Driven Development?</h2>
      <p>Traditional development treats code as king — specifications are scaffolding you discard once coding begins. SDD inverts this: specifications
      don't serve code, code serves specifications. The PRD isn't a guide — it's the source that generates implementation.</p>
      <p>With AI, specifications can now be:</p>
      <ul>
        <li><strong>Executable</strong> - Precise enough to generate working systems</li>
        <li><strong>Living</strong> - Stay in sync with code because they generate it</li>
        <li><strong>Testable</strong> - Include acceptance criteria that become automated tests</li>
        <li><strong>Traceable</strong> - Every technical decision links back to requirements</li>
      </ul>
      <p>Spec Kit is GitHub's open-source toolkit that provides templates, commands, and workflows to implement SDD systematically.</p>
      <h2>Step 1: Install Spec Kit</h2>
      <pre><code># Prerequisites
sudo apt update && sudo apt install -y python3-pip pipx
pipx install uv && pipx ensurepath

# Setup Specify CLI
uv tool install specify-cli --from git+https://github.com/github/spec-kit.git
specify check   # Should say "Specify CLI is ready to use!"</code></pre>
      <p>Initialize your project:</p>
      <pre><code># Run this in the root of your repo - say yes to continue with the risk of overwriting files
specify init . --ai copilot --script sh

# If you run into auth issues, try this:
env -u GITHUB_TOKEN specify init . --ai copilot --script sh</code></pre>
      <p>This creates: <code>.specify/</code> directory with templates and scripts; command shortcuts (<code>/speckit.specify</code>,
      <code>/speckit.plan</code>, etc.); constitution template for project principles.</p>
      <h2>Step 2: Establish Project Constitution</h2>
      <p>The constitution is your project's immutable architectural DNA — the principles that govern every specification and implementation.</p>
      <ol>
        <li>Clear chat history, ensure Agent mode with <code>Claude Sonnet 4.6</code></li>
        <li>Run:
          <pre><code>/speckit.constitution
Our OctoCAT Supply Chain application follows these principles:
- Library-first architecture for maximum reusability
- Test-driven development with contract tests before implementation
- Integration tests over mocks (real SQLite database)
- Simplicity over abstraction - use frameworks directly
- REST API design with OpenAPI documentation
- TypeScript for type safety
- Minimal dependencies - evaluate before adding</code></pre>
        </li>
        <li>Review the generated <code>.specify/memory/constitution.md</code></li>
        <li>Click <code>Keep</code> to save changes</li>
        <li>The constitution will now guide all subsequent specifications and plans</li>
      </ol>
      <h2>Step 3: Create a Feature Specification</h2>
      <p>Let's add a Purchase Order feature using spec-driven development.</p>
      <ol>
        <li>Run:

      <p><strong>Your Challenge:</strong> Add a hook to create a git commit after each agent session with proper attribution to Copilot. This creates
      an auditable trail in git history for all agent sessions.</p>
      <h2>What are Agent Hooks?</h2>
      <p>Agent Hooks allow execution of arbitrary commands or scripts at specific points in the Copilot Agent lifecycle, enabling workflows such as:</p>
      <ul>
        <li><strong>Audit Logging</strong>: Recording prompts and session events for compliance.</li>
        <li><strong>Automated Checkpoints</strong>: Creating git commits after each agent session.</li>
        <li><strong>Validation</strong>: Running linters or tests before allowing the agent to proceed.</li>
      </ul>
      <p>Hooks are defined in <code>.github/hooks/*.json</code> and support lifecycle events including <code>sessionStart</code>,
      <code>UserPromptSubmit</code>, and <code>Stop</code>.</p>
      <h2>Step 1: Explore Existing Hooks</h2>
      <ol>
        <li>Open <code>.github/hooks/hooks.json</code> to see existing hook definitions for <code>sessionStart</code>, <code>UserPromptSubmit</code>,
        and <code>Stop</code> that log events to <code>.agent.log</code></li>
        <li>Open <code>.agent.log</code> in your root workspace to see a log of your agent sessions, prompts submitted, and when sessions stopped.</li>
        <li>If you have not been using Copilot yet, start an agent session and submit a prompt to see how it gets logged.</li>
      </ol>
      <h2>Step 2: Adding a Git Commit Hook with Copilot Attribution</h2>
      <ol>
        <li>Go back to <code>.github/hooks/hooks.json</code>. Uncomment the agent hook definition under <code>Stop</code> for commits, calling
        <code>.github/hooks/checkpoint-commit.sh</code>:
          <pre><code>// comment this in if you want automatic commits after each agent session
{
  "type": "command",
  "bash": ".github/hooks/checkpoint-commit.sh",
  "cwd": ".",
  "timeoutSec": 10
}</code></pre>
        </li>
        <li>Open <code>.github/hooks/checkpoint-commit.sh</code> — creates a git commit with message "Checkpoint commit after agent session" every
        time an agent session stops.</li>
        <li>Modify the script so the commit message includes Copilot attribution:
          <pre><code># Create timestamped commit with Copilot co-author trailer
TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
git commit -m "[Checkpoint-commit] $TIMESTAMP

Co-authored-by: GitHub Copilot <copilot@github.com>" --no-verify 2>/dev/null || {
  echo "⚠️  Commit failed"
  exit 0
}</code></pre>
        </li>

        <code>Add two rocket emojis 🚀🚀 to the title in the README.</code></li>

        <code>git log --grep="Co-authored-by: GitHub Copilot" --oneline</code></li>
      </ol>
      <p>Note: if you accidentally commit to main branch, reset to undo and move to a new branch:</p>
      <pre><code>git reset HEAD~1                     # Undo last commit but keep changes staged
git checkout -b checkpoint-hook-test # Move to new branch</code></pre>

        <h2>What You Learned</h2>
        <ul><li>✅ Agent Hooks - Commands triggered at specific points in agent lifecycle</li></ul>

      <p><strong>Your Challenge:</strong> Create an agentic workflow in GitHub Actions that reviews and updates your responsive design code based on

      <h2>What Are Agentic Workflows?</h2>
      <p>Agentic Workflows are AI-powered GitHub Actions workflows that can reason, make decisions, and take actions autonomously. Unlike traditional
      YAML-based workflows with rigid, predefined steps, agentic workflows are written in markdown and use natural language to describe what the
      agent should accomplish.</p>
      <p>The agent interprets the instructions, gathers context, and dynamically determines the best path to achieve the goal — including error
      handling, retries, and adaptive decision-making. Execution is secured within a sandbox with explicit permissions and safe outputs.</p>
      <h2>Key Concepts</h2>
      <h3>Custom Front Matter - e.g. Schedule Jittering</h3>
      <p>Agentic workflow markdown files have custom frontmatter properties similar to Actions properties. For example, <code>schedule: daily</code>
      runs at a random time each day — this "jittering" prevents multiple workflows from executing simultaneously.</p>
      <pre><code>on:
  schedule: daily  # Runs at a random time each day</code></pre>
      <h3>Secure Sandbox and Permissions</h3>
      <p>Agentic workflows run in a secure sandbox with minimal default permissions:</p>
      <ul>
        <li><strong>Network isolation</strong>: Only explicitly allowed domains can be accessed</li>
        <li><strong>Read-only by default</strong>: Write permissions must be explicitly granted</li>
        <li><strong>Tool restrictions</strong>: Only specified tools and commands are available</li>
        <li><strong>Safe outputs</strong>: Only declared outputs can be produced by the agent</li>
        <li><strong>LLM guardrails</strong>: LLM session isolated in its own container with limited host access</li>
      </ul>
      <pre><code>permissions:
  contents: read
  issues: read
  pull-requests: read
network:
  allowed:
    - node  # Allow npm registry access</code></pre>
      <p>Refer to the <a href="https://github.github.io/gh-aw/introduction/architecture/" target="_blank">Security Architecture Documentation</a> for
      complete details.</p>
      <h3>Safe Outputs</h3>
      <p>Safe outputs restrict what actions the agent can take. Instead of full write access, agents declare specific outputs they can produce:</p>
      <pre><code>safe-outputs:
  create-issue:
    title-prefix: "[auto] "   # All created issues must have this prefix
    max: 1                    # Only one issue per run
  assign-to-agent:

      <p>The <a href="https://github.github.io/gh-aw/reference/safe-outputs/" target="_blank">Safe Outputs documentation</a> outlines available output

gh aw version</code></pre>
        </li>

      <h2>Step 2: Setup - Token Configuration</h2>
      <p>Configure 2 tokens with appropriate permissions before creating agentic workflows: one for Copilot requests in the Actions workflow, one to

      <ul>
        <li><strong>COPILOT_GITHUB_TOKEN</strong> (Copilot Authentication):

            <li>Resource owner is your user account (Copilot seat is owned by you)</li>

            <li>Generate token, add as repo secret <code>COPILOT_GITHUB_TOKEN</code></li>

        </li>

            <li>Go to <a href="https://github.com/settings/personal-access-tokens/new?name=GH_AW_AGENT_TOKEN&description=GitHub+Agentic+Workflows+-+Agent+assignment&actions=write&contents=write&issues=write&pull_requests=write" target="_blank">Create a fine-grained PAT</a></li>

  item.dataset.index = i;
  item.innerHTML = `<span class="nav-num">${m.num}</span><span>${m.title}</span><span class="nav-time">${m.time}</span>`;
  item.addEventListener('click', () => showModule(i));
  navGroup.appendChild(item);
});

function showModule(index) {
  const m = modules[index];
  document.querySelectorAll('.nav-item').forEach((el, i) => el.classList.toggle('active', i === index));

  let badgeHtml = '';
  if (m.badges && m.badges.length) {
    badgeHtml = `<div class="badge-row">${m.badges.map(b => `<span class="badge">${b}</span>`).join('')}</div>`;
  }
  let scenarioHtml = '';
  if (m.scenario) {
    scenarioHtml = `<div class="scenario"><strong>Scenario:</strong> ${m.scenario}</div>`;
  }
  let subtitleHtml = m.subtitle ? `<div class="meta-line">${m.subtitle}</div>` : '';

  const prevBtn = index > 0 ? `<button onclick="showModule(${index - 1})">« Previous</button>` : `<button disabled>« Previous</button>`;
  const nextBtn = index < modules.length - 1 ? `<button onclick="showModule(${index + 1})">Next »</button>` : `<button disabled>Next »</button>`;

  content.innerHTML = `
    <h1>${m.title}</h1>
    ${subtitleHtml}
    ${scenarioHtml}
    ${badgeHtml}
    <div class="body">${m.html}</div>
    <div class="footer-nav">${prevBtn}${nextBtn}</div>
  `;
  window.scrollTo(0, 0);
}

showModule(0);
</script>
</body>
</html>
